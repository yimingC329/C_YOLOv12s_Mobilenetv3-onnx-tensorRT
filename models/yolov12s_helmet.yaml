# YOLOv12s detection baseline for the two-class SHWD helmet dataset.
# This is the width/depth-expanded "s" form of the official YOLO12 YAML.
# It keeps A2C2f attention blocks in the backbone and neck.

nc: 2
depth_multiple: 1.0
width_multiple: 1.0

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, C3k2, [128, false, 0.25]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, C3k2, [256, false, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, A2C2f, [256, true, 4]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, A2C2f, [512, true, 1]]

head:
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, A2C2f, [256, false, -1]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, A2C2f, [128, false, -1]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, A2C2f, [256, false, -1]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, true]]
  - [[14, 17, 20], 1, Detect, [nc]]
